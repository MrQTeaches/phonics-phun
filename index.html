<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mr. Q Teaches — Phonics Revision</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap');
  :root{--sky:#e0f4ff;--blue:#3a9fd8;--blue-dark:#1e6fa8;--green:#4cbb7a;--green-dark:#2d8f5a;
    --yellow:#ffd54f;--red:#ff6b6b;--purple:#a78bfa;--purple-dark:#7c3aed;
    --text:#2d3748;--muted:#718096;--radius:18px;
    --shadow:0 6px 24px rgba(0,0,0,.10);--shadow-sm:0 2px 8px rgba(0,0,0,.08);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#e0f4ff 0%,#f0fff4 50%,#fff9e6 100%);min-height:100vh;color:var(--text)}
  header{background:linear-gradient(135deg,var(--blue) 0%,var(--purple) 100%);color:white;padding:16px 28px 12px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(58,159,216,.3)}
  .logo{font-family:'Fredoka One',cursive;font-size:1.9rem;letter-spacing:1px}
  .logo span{font-size:1.3rem;vertical-align:middle;margin-left:6px}
  .subtitle{font-size:.9rem;opacity:.85;font-weight:600;margin-top:2px}
  #level-bar{display:flex;gap:10px;padding:12px 20px;background:white;border-bottom:3px solid #e8f4fd;overflow-x:auto;align-items:center}
  #level-bar label{font-weight:800;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-right:4px;white-space:nowrap}
  .level-btn{padding:7px 18px;border-radius:30px;border:3px solid transparent;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:all .18s;white-space:nowrap}
  .level-btn.prep{background:#fff0f6;color:#e91e8c;border-color:#fbb6ce}
  .level-btn.gr1{background:#e8f4ff;color:var(--blue-dark);border-color:#bee3f8}
  .level-btn.gr2{background:#f0fff4;color:var(--green-dark);border-color:#9ae6b4}
  .level-btn.active,.level-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);filter:brightness(.93)}
  .level-btn.prep.active{background:#e91e8c;color:white;border-color:#e91e8c}
  .level-btn.gr1.active{background:var(--blue);color:white;border-color:var(--blue)}
  .level-btn.gr2.active{background:var(--green);color:white;border-color:var(--green)}
  #mode-bar{display:flex;gap:8px;padding:10px 20px;background:var(--sky);border-bottom:2px solid #cce8f4;overflow-x:auto}
  .mode-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 16px;border-radius:var(--radius);border:none;background:white;font-family:'Nunito',sans-serif;font-weight:700;font-size:.78rem;color:var(--muted);cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm);white-space:nowrap}
  .mode-btn .icon{font-size:1.4rem}
  .mode-btn.active{background:var(--blue);color:white;box-shadow:0 4px 12px rgba(58,159,216,.35);transform:translateY(-2px)}
  .mode-btn:hover:not(.active){transform:translateY(-2px);background:#f0f8ff}
  #app{padding:22px 18px;max-width:820px;margin:0 auto}
  /* SOUND WALL */
  #sound-wall{display:none}#sound-wall.active{display:block}
  .set-group{margin-bottom:26px}
  .set-title{font-family:'Fredoka One',cursive;font-size:1.05rem;color:var(--blue-dark);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .set-title::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,#bee3f8,transparent);border-radius:2px}
  .gpc-grid{display:flex;flex-wrap:wrap;gap:9px}
  .gpc-card{width:88px;height:88px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-sm);border:3px solid transparent;transition:all .2s;position:relative;overflow:hidden;user-select:none}
  .gpc-card:hover{transform:scale(1.08);box-shadow:var(--shadow)}
  .gpc-card .grapheme{font-family:'Fredoka One',cursive;font-size:2rem;line-height:1.1;text-align:center;word-break:break-word;max-width:82px;padding:0 3px}
  .gpc-card .grapheme.len-3{font-size:1.5rem}.gpc-card .grapheme.len-4{font-size:1.2rem}
  .gpc-card .grapheme.len-5{font-size:1rem}.gpc-card .grapheme.len-6{font-size:.88rem}
  .gpc-card .grapheme.len-long{font-size:.72rem;line-height:1.25}
  .gpc-card .phoneme{font-size:.66rem;font-weight:700;opacity:.75;margin-top:3px;text-align:center;padding:0 3px}
  .front{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}
  .gpc-card .back{display:none}
  .gpc-card.flipped .front{display:none}
  .gpc-card.flipped .back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;padding:4px}
  /* FLASHCARDS */
  #flashcard-mode{display:none}#flashcard-mode.active{display:flex;flex-direction:column;align-items:center;gap:18px}
  .fc-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .fc-controls select,.fc-controls button{padding:8px 18px;border-radius:30px;border:2px solid #bee3f8;font-family:'Nunito',sans-serif;font-weight:700;font-size:.9rem;background:white;color:var(--text);cursor:pointer}
  .fc-controls button{background:var(--blue);color:white;border-color:var(--blue)}
  .flashcard-wrap{perspective:800px;width:300px;height:210px}
  .flashcard{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer}
  .flashcard.flipped{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .fc-front{background:linear-gradient(135deg,#fff,#f0f8ff);border:4px solid #bee3f8}
  .fc-back{background:linear-gradient(135deg,#f0fff4,#fff);border:4px solid #9ae6b4;transform:rotateY(180deg)}
  .fc-letter{font-family:'Fredoka One',cursive;font-size:3.4rem;color:var(--blue-dark);line-height:1}
  .fc-hint{font-size:.8rem;font-weight:700;color:var(--muted);margin-top:6px}
  .fc-word{font-size:1.25rem;font-weight:800;color:var(--green-dark);margin-top:4px}
  .fc-sound{font-size:.95rem;font-weight:700;color:var(--blue)}
  .fc-emoji{font-size:2.1rem}
  .fc-set-label{font-size:.68rem;font-weight:700;color:var(--muted);margin-top:4px}
  .fc-nav{display:flex;gap:16px;align-items:center}
  .fc-nav button{width:50px;height:50px;border-radius:50%;border:none;background:var(--blue);color:white;font-size:1.4rem;cursor:pointer;box-shadow:var(--shadow-sm);transition:all .15s}
  .fc-nav button:hover{transform:scale(1.1);background:var(--blue-dark)}
  .fc-counter{font-weight:800;font-size:1rem;color:var(--muted);min-width:60px;text-align:center}
  /* WORD SORT */
  #word-sort{display:none}#word-sort.active{display:block}
  .sort-instruction{text-align:center;font-weight:700;font-size:1rem;color:var(--blue-dark);margin-bottom:16px;background:white;padding:12px;border-radius:12px;box-shadow:var(--shadow-sm)}
  .sort-zones{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
  .sort-zone{min-width:140px;min-height:110px;border-radius:var(--radius);border:3px dashed #bee3f8;background:#f7fbff;display:flex;flex-direction:column;align-items:center;padding:10px 8px;gap:8px;transition:background .2s}
  .sort-zone.drag-over{background:#e0f4ff;border-color:var(--blue)}
  .sort-zone .zone-label{font-family:'Fredoka One',cursive;font-size:1.3rem;color:var(--blue-dark);text-align:center}
  .sort-zone .zone-sublabel{font-size:.68rem;font-weight:700;color:var(--muted)}
  .word-tokens{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
  .word-token{padding:10px 18px;border-radius:30px;background:white;border:3px solid #e2e8f0;font-weight:800;font-size:1.05rem;color:var(--text);cursor:grab;box-shadow:var(--shadow-sm);transition:all .15s;user-select:none}
  .word-token:hover{transform:scale(1.06);box-shadow:var(--shadow);border-color:var(--blue)}
  .word-token.dragging{opacity:.4}
  .word-token.placed{background:#f0fff4;border-color:var(--green);color:var(--green-dark);cursor:default;font-size:.92rem}
  .sort-result{text-align:center;font-weight:800;font-size:1rem;min-height:28px}
  .sort-result.correct{color:var(--green-dark)}.sort-result.wrong{color:var(--red)}
  .sort-actions{display:flex;gap:12px;justify-content:center;margin-top:10px}
  .btn{padding:10px 24px;border-radius:30px;border:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm)}
  .btn-blue{background:var(--blue);color:white}.btn-green{background:var(--green);color:white}
  .btn-yellow{background:var(--yellow);color:#5f4200}.btn-purple{background:var(--purple);color:white}
  .btn:hover{filter:brightness(.92);transform:translateY(-1px)}
  /* BLEND BUILDER */
  #blend-mode{display:none}#blend-mode.active{display:block}
  .blend-instruction{text-align:center;font-weight:700;font-size:1rem;color:var(--purple-dark);margin-bottom:16px;background:white;padding:12px;border-radius:12px;box-shadow:var(--shadow-sm)}
  .blend-picture{font-size:4rem;display:block;text-align:center;margin-bottom:8px}
  .blend-hint{text-align:center;font-weight:700;font-size:1rem;color:var(--muted);margin-bottom:14px}
  .letter-choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
  .letter-tile{width:58px;height:58px;border-radius:12px;background:white;border:3px solid #e2e8f0;font-family:'Fredoka One',cursive;font-size:1.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:all .15s}
  .letter-tile:hover{border-color:var(--purple);transform:scale(1.08);color:var(--purple-dark)}
  .letter-tile.used{opacity:.3;pointer-events:none}
  .word-builder-display{display:flex;gap:8px;justify-content:center;min-height:70px;background:white;border-radius:var(--radius);padding:10px 16px;box-shadow:var(--shadow-sm);margin-bottom:14px;align-items:center;flex-wrap:wrap}
  .builder-letter{width:54px;height:54px;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--blue));color:white;font-family:'Fredoka One',cursive;font-size:1.8rem;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(124,58,237,.3);animation:pop .2s cubic-bezier(.4,0,.2,1);cursor:pointer}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
  .builder-placeholder{font-size:.9rem;font-weight:700;color:#cbd5e0}
  .blend-result{text-align:center;font-size:1.1rem;font-weight:800;min-height:32px}
  .blend-result.correct{color:var(--green-dark)}.blend-result.wrong{color:var(--red)}
  /* SIGHT WORDS */
  #hfw-quiz{display:none}#hfw-quiz.active{display:block}
  .hfw-sentence{font-size:1.35rem;font-weight:700;color:var(--text);background:white;border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow-sm);line-height:1.7;margin-bottom:16px;text-align:center}
  .hfw-blank{display:inline-block;border-bottom:3px solid var(--blue);min-width:60px;font-style:italic;color:var(--muted);padding:0 4px}
  .hfw-options{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:16px}
  .hfw-option{padding:11px 26px;border-radius:30px;border:3px solid #e2e8f0;background:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:1.05rem;cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm)}
  .hfw-option:hover{border-color:var(--blue);transform:scale(1.04)}
  .hfw-option.correct{background:var(--green);color:white;border-color:var(--green-dark)}
  .hfw-option.wrong{background:var(--red);color:white;border-color:#c0392b}
  .hfw-score{text-align:center;font-weight:800;font-size:1rem;color:var(--muted);margin-top:8px}
  .progress-bar-wrap{background:#e2e8f0;border-radius:30px;height:10px;margin-bottom:18px;overflow:hidden}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:30px;transition:width .4s}
  /* MORPHOLOGY */
  #morph-mode{display:none}#morph-mode.active{display:block}
  .morph-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;justify-content:center}
  .morph-tab{padding:8px 18px;border-radius:30px;border:2px solid #bee3f8;background:white;font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer;transition:all .15s}
  .morph-tab.active{background:var(--purple);color:white;border-color:var(--purple-dark)}
  .morph-activity{background:white;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
  .morph-activity-title{font-family:'Fredoka One',cursive;font-size:1.15rem;color:var(--purple-dark);margin-bottom:6px}
  .morph-activity-desc{font-size:.88rem;font-weight:600;color:var(--muted);margin-bottom:18px}
  /* Build-a-word */
  .baw-base{font-family:'Fredoka One',cursive;font-size:2.2rem;color:var(--blue-dark);text-align:center;margin-bottom:14px}
  .baw-affixes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
  .baw-chip{padding:10px 20px;border-radius:30px;font-weight:800;font-size:1rem;cursor:pointer;border:3px solid transparent;transition:all .18s;box-shadow:var(--shadow-sm)}
  .baw-chip.prefix{background:#fff0f6;color:#d6336c;border-color:#faa2c1}
  .baw-chip.suffix{background:#f0fff4;color:var(--green-dark);border-color:#9ae6b4}
  .baw-chip.selected{transform:scale(1.08);box-shadow:var(--shadow)}
  .baw-chip.prefix.selected{background:#d6336c;color:white}
  .baw-chip.suffix.selected{background:var(--green);color:white}
  .baw-result-display{text-align:center;min-height:50px;font-family:'Fredoka One',cursive;font-size:1.6rem;color:var(--blue-dark);margin-bottom:8px;background:#f7fbff;border-radius:12px;padding:10px;border:2px dashed #bee3f8}
  .baw-meaning{text-align:center;font-weight:700;font-size:.95rem;color:var(--muted);min-height:24px;margin-bottom:12px}
  /* Sort-the-word */
  .stw-prompt{text-align:center;font-weight:700;font-size:1rem;color:var(--text);margin-bottom:16px;background:#f7fbff;padding:12px;border-radius:12px}
  .stw-word{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--blue-dark);text-align:center;margin-bottom:14px}
  .stw-zones{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .stw-zone{min-width:130px;min-height:80px;border-radius:var(--radius);border:3px dashed #bee3f8;background:#f7fbff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px;gap:6px;cursor:pointer;transition:all .2s;font-weight:700;font-size:.9rem;color:var(--muted)}
  .stw-zone:hover{background:#e0f4ff;border-color:var(--blue)}
  .stw-zone.chosen-correct{background:var(--green);color:white;border-color:var(--green-dark)}
  .stw-zone.chosen-wrong{background:var(--red);color:white;border-color:#c0392b}
  .stw-zone .sz-label{font-family:'Fredoka One',cursive;font-size:1.1rem;color:inherit}
  .stw-feedback{text-align:center;font-weight:800;font-size:1rem;min-height:28px;margin-bottom:10px}
  .stw-feedback.ok{color:var(--green-dark)}.stw-feedback.bad{color:var(--red)}
  /* Crack-the-code */
  .ctc-sentence{font-size:1.2rem;font-weight:700;color:var(--text);background:#f7fbff;border-radius:12px;padding:14px 18px;margin-bottom:14px;line-height:1.8;text-align:center}
  .ctc-highlight{background:var(--yellow);padding:2px 6px;border-radius:6px;font-family:'Fredoka One',cursive;cursor:default}
  .ctc-options{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px}
  .ctc-opt{padding:9px 20px;border-radius:30px;border:3px solid #e2e8f0;background:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm)}
  .ctc-opt:hover{border-color:var(--purple);transform:scale(1.04)}
  .ctc-opt.correct{background:var(--green);color:white;border-color:var(--green-dark)}
  .ctc-opt.wrong{background:var(--red);color:white;border-color:#c0392b}
  .ctc-feedback{text-align:center;font-weight:800;font-size:1rem;min-height:28px}
  .ctc-feedback.ok{color:var(--green-dark)}.ctc-feedback.bad{color:var(--red)}
  /* BURST */
  .starburst{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:none;opacity:0;transition:opacity .3s}
  .starburst.show{opacity:1}
  .starburst-inner{font-size:5rem;animation:burst .6s cubic-bezier(.4,0,.2,1)}
  @keyframes burst{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
  @media(max-width:540px){.gpc-card{width:74px;height:74px}.gpc-card .grapheme{font-size:1.7rem}.flashcard-wrap{width:260px;height:185px}.fc-letter{font-size:2.8rem}}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">🎓 Mr. Q Teaches <span>📖</span></div>
    <div class="subtitle">Revision Tool — Foundation · Grade 1 · Grade 2</div>
  </div>
</header>

  <div id="level-bar">
    <label>My Level:</label>
    <button class="level-btn prep" onclick="setLevel('prep')">🌱 Foundation</button>
    <button class="level-btn gr1 active" onclick="setLevel('gr1')">📚 Grade 1</button>
    <button class="level-btn gr2" onclick="setLevel('gr2')">🚀 Grade 2</button>
  </div>
<div id="mode-bar">
  <button class="mode-btn active" onclick="setMode('wall')" id="btn-wall"><span class="icon">🧱</span>Sound Wall</button>
  <button class="mode-btn" onclick="setMode('flash')" id="btn-flash"><span class="icon">⚡</span>Flashcards</button>
  <button class="mode-btn" onclick="setMode('sort')" id="btn-sort"><span class="icon">🗂️</span>Word Sort</button>
  <button class="mode-btn" onclick="setMode('blend')" id="btn-blend"><span class="icon">🔀</span>Blend It!</button>
  <button class="mode-btn" onclick="setMode('hfw')" id="btn-hfw"><span class="icon">💬</span>Sight Words</button>
  <button class="mode-btn" onclick="setMode('morph')" id="btn-morph"><span class="icon">🧩</span>Morphology</button>
</div>

<div id="app">
  <div id="sound-wall" class="active"></div>

  <div id="flashcard-mode" style="display:none">
    <div class="fc-controls">
      <select id="fc-set-select"></select>
      <button onclick="shuffleFlash()">🔀 Shuffle</button>
    </div>
    <div class="flashcard-wrap">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="fc-face fc-front">
          <div class="fc-letter" id="fc-front-letter">s</div>
          <div class="fc-hint">Tap to reveal 👆</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-emoji" id="fc-back-emoji">🐍</div>
          <div class="fc-sound" id="fc-back-sound">/s/</div>
          <div class="fc-word" id="fc-back-word">snake</div>
          <div class="fc-set-label" id="fc-back-set"></div>
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button onclick="fcNav(-1)">←</button>
      <div class="fc-counter" id="fc-counter">1 / ?</div>
      <button onclick="fcNav(1)">→</button>
    </div>
    <p style="font-size:.78rem;color:var(--muted);font-weight:600;text-align:center;margin-top:4px">Tap the card to flip &bull; Arrows to navigate</p>
  </div>

  <div id="word-sort" style="display:none">
    <div class="sort-instruction" id="sort-instruction"></div>
    <div class="sort-zones" id="sort-zones"></div>
    <div class="word-tokens" id="word-tokens"></div>
    <div class="sort-result" id="sort-result"></div>
    <div class="sort-actions">
      <button class="btn btn-blue" onclick="checkSort()">✅ Check</button>
      <button class="btn btn-yellow" onclick="initSort()">🔁 New Round</button>
    </div>
  </div>

  <div id="blend-mode" style="display:none">
    <div class="blend-instruction">Build the word that matches the picture! 🖼️</div>
    <span class="blend-picture" id="blend-pic"></span>
    <div class="blend-hint" id="blend-hint"></div>
    <div class="word-builder-display" id="builder-display">
      <span class="builder-placeholder">Click letters below to build the word</span>
    </div>
    <div class="letter-choices" id="letter-choices"></div>
    <div class="blend-result" id="blend-result"></div>
    <div class="sort-actions">
      <button class="btn btn-purple" onclick="clearBuilder()">⌫ Clear</button>
      <button class="btn btn-blue" onclick="checkBlend()">✅ Check</button>
      <button class="btn btn-yellow" onclick="nextBlend()">➡️ Next Word</button>
    </div>
  </div>

  <div id="hfw-quiz" style="display:none">

// ── SOUND WALL ───────────────────────────────────────────────────────────
function initWall(){
  const container=document.getElementById('sound-wall');
  container.innerHTML='';
  DATA[currentLevel].sets.forEach((set,si)=>{
    const grp=document.createElement('div');grp.className='set-group';
    const title=document.createElement('div');title.className='set-title';title.textContent=set.name;
    grp.appendChild(title);
    const grid=document.createElement('div');grid.className='gpc-grid';
    set.gpcs.forEach((gpc,gi)=>{
      const pal=PALETTES[(si*3+gi)%PALETTES.length];
      const len=gpc.g.length;
      const cls=len<=2?'':(len===3?'len-3':len===4?'len-4':len===5?'len-5':len===6?'len-6':'len-long');
      const card=document.createElement('div');card.className='gpc-card';
      card.style.background=pal.bg;card.style.borderColor=pal.border;
      card.innerHTML=`<div class="front"><div class="grapheme ${cls}" style="color:${pal.text}">${gpc.g}</div><div class="phoneme" style="color:${pal.text}">${gpc.sound}</div></div><div class="back" style="background:${pal.bg}"><div style="font-size:1.6rem">${gpc.emoji}</div><div style="font-size:.73rem;font-weight:800;color:${pal.text}">${gpc.keyword}</div><div style="font-size:.62rem;color:${pal.text};opacity:.7">${gpc.sound}</div></div>`;
      card.onclick=()=>card.classList.toggle('flipped');
      grid.appendChild(card);
    });
    grp.appendChild(grid);container.appendChild(grp);
  });
}

// ── WORD SORT ──────────────────────────────────────────────────────────────
function initSort(){
  const games=DATA[currentLevel].sortGames;
  const game=games[Math.floor(Math.random()*games.length)];
  sortDropped={};game.zones.forEach(z=>sortDropped[z]=[]);
  document.getElementById('sort-instruction').textContent=game.instruction;
  document.getElementById('sort-result').textContent='';
  const zonesEl=document.getElementById('sort-zones');zonesEl.innerHTML='';
  game.zones.forEach(zone=>{
    const el=document.createElement('div');el.className='sort-zone';el.dataset.zone=zone;
    el.innerHTML=`<div class="zone-label">${zone}</div><div class="zone-sublabel">Drop words here</div>`;
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{
      e.preventDefault();el.classList.remove('drag-over');
      const word=e.dataTransfer.getData('text');
      const tok=document.querySelector(`.word-token[data-word="${CSS.escape(word)}"]`)||document.querySelector(`.word-token[data-word="${word}"]`);
      if(tok&&!tok.classList.contains('placed')){
        sortDropped[zone].push(word);tok.classList.add('placed');
        const p=document.createElement('div');p.className='word-token placed';p.textContent=word;el.appendChild(p);
      }
    });
    zonesEl.appendChild(el);
  });
  const all=Object.values(game.words).flat().sort(()=>Math.random()-.5);
  const tokensEl=document.getElementById('word-tokens');tokensEl.innerHTML='';
  all.forEach(w=>{
    const tok=document.createElement('div');tok.className='word-token';tok.textContent=w;tok.dataset.word=w;tok.draggable=true;
    tok.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',w);tok.classList.add('dragging')});
    tok.addEventListener('dragend',()=>tok.classList.remove('dragging'));
    tokensEl.appendChild(tok);
  });
  document.getElementById('word-sort').dataset.gameJson=JSON.stringify(game);
}
function checkSort(){
  const game=JSON.parse(document.getElementById('word-sort').dataset.gameJson||'{}');
  if(!game.zones)return;
  let correct=0,total=0;
  game.zones.forEach(zone=>{
    (sortDropped[zone]||[]).forEach(w=>{total++;if((game.words[zone]||[]).includes(w))correct++;});
  });
  const res=document.getElementById('sort-result');
  if(total===0){res.textContent='⬆️ Drag some words first!';res.className='sort-result';return}
  if(correct===total&&total>=Object.values(game.words).flat().length){
    res.textContent=`🎉 Amazing! All ${correct} correct!`;res.className='sort-result correct';showBurst();
  } else {
    res.textContent=`✅ ${correct} correct  ❌ ${total-correct} to check. Try again!`;res.className='sort-result wrong';
  }
}

  const bw=DATA[currentLevel].blendWords[blendIndex];
  document.getElementById('blend-pic').textContent=bw.emoji;

function checkBlend(){
  const bw=DATA[currentLevel].blendWords[blendIndex];
  const built=builderWord.map(b=>b.letter).join('');
  const res=document.getElementById('blend-result');
  if(built.toLowerCase()===bw.word.toLowerCase()){
    res.textContent=`🎉 Yes! "${bw.word}"! Great work!`;res.className='blend-result correct';showBurst();
  } else {
    res.textContent=`🤔 You built "${built}" — try again!`;res.className='blend-result wrong';
  }
}

// ── SIGHT WORDS ───────────────────────────────────────────────────────────
let hfwQ=[],hfwAnswered=false;
function initHFW(){
  hfwScore=0;hfwIndex=0;hfwAnswered=false;
  hfwQ=[...DATA[currentLevel].hfw].sort(()=>Math.random()-.5);
  renderHFW();
}
function renderHFW(){
  if(hfwIndex>=hfwQ.length){
    document.getElementById('hfw-sentence').innerHTML=`🎊 Round complete! You scored <strong>${hfwScore} / ${hfwQ.length}</strong>!`;
    document.getElementById('hfw-options').innerHTML='';
    document.getElementById('hfw-score').textContent='';
    document.getElementById('hfw-progress').style.width='100%';
    if(hfwScore>=Math.ceil(hfwQ.length*.8))showBurst();
    return;
  }
  const q=hfwQ[hfwIndex];hfwAnswered=false;
  document.getElementById('hfw-progress').style.width=`${(hfwIndex/hfwQ.length)*100}%`;
  // Show blank as underscore line sized to match the answer length
  const blankLine='_'.repeat(Math.max(3,q.a.length));
  document.getElementById('hfw-sentence').innerHTML=q.s.replace('___',`<span class="hfw-blank">${blankLine}</span>`);
  document.getElementById('hfw-score').textContent=`Score: ${hfwScore} / ${hfwIndex}`;
  const opts=[q.a,...q.d].sort(()=>Math.random()-.5);
  const optsEl=document.getElementById('hfw-options');optsEl.innerHTML='';
  opts.forEach(opt=>{
    const btn=document.createElement('button');btn.className='hfw-option';btn.textContent=opt;
    btn.onclick=()=>{
      if(hfwAnswered)return;hfwAnswered=true;
      if(opt===q.a){btn.classList.add('correct');hfwScore++}
      else{btn.classList.add('wrong');optsEl.querySelectorAll('.hfw-option').forEach(b=>{if(b.textContent===q.a)b.classList.add('correct')})}
      document.getElementById('hfw-score').textContent=`Score: ${hfwScore} / ${hfwIndex+1}`;
      setTimeout(()=>{hfwIndex++;hfwAnswered=false;renderHFW()},1300);
    };
    optsEl.appendChild(btn);
  });
}

// ── MORPHOLOGY ─────────────────────────────────────────────────────────────
function initMorph(){
  morphTabIndex=0; morphActivityTab='build';
  renderMorphTabs();
  renderMorphActivity();
}
function renderMorphTabs(){
  const ms=DATA[currentLevel].morphSets;
  const tabBar=document.getElementById('morph-tab-bar');
  tabBar.innerHTML='';
  ms.forEach((m,i)=>{
    const btn=document.createElement('button');btn.className='morph-tab'+(i===morphTabIndex?' active':'');
    btn.textContent=m.title;btn.onclick=()=>{morphTabIndex=i;morphActivityTab='build';renderMorphTabs();renderMorphActivity()};
    tabBar.appendChild(btn);
  });
}
function setMorphActivity(t){morphActivityTab=t;renderMorphActivity()}
function renderMorphActivity(){
  const ms=DATA[currentLevel].morphSets[morphTabIndex];
  const container=document.getElementById('morph-activity-area');
  // Sub-tabs
  const subTabHTML=`<div style="display:flex;gap:8px;margin-bottom:16px;justify-content:center;flex-wrap:wrap">
    <button class="morph-tab ${morphActivityTab==='build'?'active':''}" onclick="setMorphActivity('build')">🔨 Build It</button>
    <button class="morph-tab ${morphActivityTab==='sort'?'active':''}" onclick="setMorphActivity('sort')">🗂️ Sort It</button>
    <button class="morph-tab ${morphActivityTab==='crack'?'active':''}" onclick="setMorphActivity('crack')">🔍 Crack It</button>
  </div>`;
  if(morphActivityTab==='build')      container.innerHTML=subTabHTML+buildBuildIt(ms);
  else if(morphActivityTab==='sort')  container.innerHTML=subTabHTML+buildSortIt(ms);
  else                                container.innerHTML=subTabHTML+buildCrackIt(ms);
  attachMorphEvents(ms);
}

// BUILD IT — click prefix/suffix chips to construct the word
function buildBuildIt(ms){
  const affix=ms.affixes[0];
  const isPre=affix.type==='prefix';
  return `<div class="morph-activity">
    <div class="morph-activity-title">🔨 Build It — ${ms.title}</div>
    <div class="morph-activity-desc">${ms.rule}</div>
    <div class="baw-base">${ms.base}</div>
    <div class="baw-affixes">
      ${ms.affixes.map((a,i)=>`<div class="baw-chip ${a.type}" id="baw-chip-${i}" onclick="selectAffix(${i})">${a.label}</div>`).join('')}
    </div>
    <div class="baw-result-display" id="baw-result">${isPre?'[ ___ ] + '+ms.base:ms.base+' + [ ___ ]'}</div>
    <div class="baw-meaning" id="baw-meaning">Tap a ${ms.affixes[0].type} above to build the word</div>
    <button class="btn btn-yellow" style="margin-top:8px" onclick="resetBuildIt()">🔁 Reset</button>
  </div>`;
}
let selectedAffixIdx=-1;
function selectAffix(i){
  selectedAffixIdx=i;
  document.querySelectorAll('.baw-chip').forEach((c,j)=>c.classList.toggle('selected',j===i));
  const ms=DATA[currentLevel].morphSets[morphTabIndex];
  const a=ms.affixes[i];
  document.getElementById('baw-result').textContent=a.result;
  document.getElementById('baw-meaning').textContent='✅ '+a.meaning;
  showBurst();
}
function resetBuildIt(){
  selectedAffixIdx=-1;
  document.querySelectorAll('.baw-chip').forEach(c=>c.classList.remove('selected'));
  const ms=DATA[currentLevel].morphSets[morphTabIndex];
  const isPre=ms.affixes[0].type==='prefix';
  document.getElementById('baw-result').textContent=isPre?'[ ___ ] + '+ms.base:ms.base+' + [ ___ ]';
  document.getElementById('baw-meaning').textContent='Tap a '+ms.affixes[0].type+' above to build the word';
}

// SORT IT — drag-or-tap words into correct categories
function buildSortIt(ms){
  const cats=[...new Set(ms.sortWords.map(w=>w.category))];
  const catLabels={};ms.sortWords.forEach(w=>catLabels[w.category]=w.label);
  const zonesHTML=cats.map(c=>`<div class="sort-zone" id="msz-${c}" data-cat="${c}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="morphDrop(event,'${c}')"><div class="sz-label">${catLabels[c]}</div><div class="zone-sublabel" style="font-size:.66rem">(${c})</div></div>`).join('');
  const shuffled=[...ms.sortWords].sort(()=>Math.random()-.5);
  const tokensHTML=shuffled.map(w=>`<div class="word-token" id="mstok-${w.word}" draggable="true" data-word="${w.word}" data-cat="${w.category}" ondragstart="event.dataTransfer.setData('morph-word','${w.word}');this.classList.add('dragging')" ondragend="this.classList.remove('dragging')" onclick="morphTap('${w.word}','${w.category}')">${w.word}</div>`).join('');
  return `<div class="morph-activity">
    <div class="morph-activity-title">🗂️ Sort It — ${ms.title}</div>
    <div class="morph-activity-desc">Drag (or tap) each word into the correct box.</div>
    <div class="sort-zones" id="morph-sort-zones">${zonesHTML}</div>
    <div class="word-tokens" id="morph-sort-tokens">${tokensHTML}</div>
    <div class="sort-result" id="morph-sort-result"></div>
    <div class="sort-actions">
      <button class="btn btn-blue" onclick="checkMorphSort()">✅ Check</button>
      <button class="btn btn-yellow" onclick="renderMorphActivity()">🔁 Reset</button>
    </div>
  </div>`;
}
const morphSortPlaced={};
function morphDrop(e,cat){
  e.preventDefault();document.getElementById('msz-'+cat).classList.remove('drag-over');
  const word=e.dataTransfer.getData('morph-word');morphPlace(word,cat);
}
function morphTap(word,correctCat){
  const tok=document.getElementById('mstok-'+word);
  if(!tok||tok.classList.contains('placed'))return;
  // cycle through zones on tap
  const ms=DATA[currentLevel].morphSets[morphTabIndex];
  const cats=[...new Set(ms.sortWords.map(w=>w.category))];
  const current=morphSortPlaced[word]||null;
  const idx=current?cats.indexOf(current):-1;
  const next=cats[(idx+1)%cats.length];
  if(current)morphSortPlaced[word]=next;
  else morphSortPlaced[word]=next;
  morphPlace(word,next,true);
}
function morphPlace(word,cat,fromTap=false){
  const tok=document.getElementById('mstok-'+word);
  if(!tok)return;
  tok.classList.add('placed');
  morphSortPlaced[word]=cat;
  const zone=document.getElementById('msz-'+cat);
  const p=document.createElement('div');p.className='word-token placed';p.textContent=word;
  p.style.fontSize='.88rem';zone.appendChild(p);
  tok.style.display='none';
}
function checkMorphSort(){
  const ms=DATA[currentLevel].morphSets[morphTabIndex];
  let correct=0,total=0;
  ms.sortWords.forEach(sw=>{
    if(morphSortPlaced[sw.word]!==undefined){total++;if(morphSortPlaced[sw.word]===sw.category)correct++;}
  });
  const res=document.getElementById('morph-sort-result');
  if(total===0){res.textContent='⬆️ Place some words first!';res.className='sort-result';return}
  if(correct===total&&total>=ms.sortWords.length){
    res.textContent=`🎉 All ${correct} sorted correctly!`;res.className='sort-result correct';showBurst();
  } else {
    res.textContent=`✅ ${correct} correct  ❌ ${total-correct} to check.`;res.className='sort-result wrong';
  }
}

// CRACK IT — sentence with highlighted morpheme, pick meaning
let ctcIndex=0,ctcAnswered=false;
function buildCrackIt(ms){
  ctcIndex=0;ctcAnswered=false;
  return buildCTCItem(ms);
}
function buildCTCItem(ms){
  const items=[...ms.ctc].sort(()=>Math.random()-.5);
  ms._ctcShuffled=items;
  ctcIndex=0;
  return renderCTCItem(ms);
}
function renderCTCItem(ms){
  const items=ms._ctcShuffled||ms.ctc;
  if(ctcIndex>=items.length){
    return `<div class="morph-activity"><div class="morph-activity-title">🔍 Crack It — ${ms.title}</div><div style="text-align:center;padding:30px;font-weight:800;font-size:1.1rem;color:var(--green-dark)">🎉 You cracked all the codes! Amazing!</div><button class="btn btn-yellow" onclick="ctcIndex=0;renderMorphActivity()">🔁 Play again</button></div>`;
  }
  const q=items[ctcIndex];
  const sentence=q.sentence.replace(q.highlighted,`<span class="ctc-highlight">${q.highlighted}</span>`);
  const opts=[q.answer,...q.options.filter(o=>o!==q.answer)].sort(()=>Math.random()-.5);
  return `<div class="morph-activity" id="ctc-card">
    <div class="morph-activity-title">🔍 Crack It — ${ms.title}</div>
    <div class="morph-activity-desc">The highlighted word has a morpheme in it. What does it mean?</div>
    <div class="ctc-sentence">${sentence}</div>
    <div style="font-weight:700;font-size:.9rem;color:var(--muted);text-align:center;margin-bottom:10px">What does <strong>${q.highlighted}</strong> mean?</div>
    <div class="ctc-options">${opts.map(o=>`<div class="ctc-opt" onclick="checkCTC('${o.replace(/'/g,"\\'")}','${q.answer.replace(/'/g,"\\'")}','${q.meaning.replace(/'/g,"\\'")}')">${o}</div>`).join('')}</div>
    <div class="ctc-feedback" id="ctc-feedback"></div>
    <div style="text-align:center;margin-top:12px;display:flex;gap:10px;justify-content:center">
      <button class="btn btn-yellow" id="ctc-next-btn" style="display:none" onclick="ctcIndex++;renderMorphActivity()">➡️ Next</button>
      <div style="font-weight:700;color:var(--muted);font-size:.85rem;margin-top:8px">${ctcIndex+1} / ${items.length}</div>
    </div>
  </div>`;
}
function checkCTC(chosen,answer,meaning){
  if(ctcAnswered)return;ctcAnswered=true;
  document.querySelectorAll('.ctc-opt').forEach(o=>{
    if(o.textContent===answer)o.classList.add('correct');
    else if(o.textContent===chosen&&chosen!==answer)o.classList.add('wrong');
    o.style.pointerEvents='none';
  });
  const fb=document.getElementById('ctc-feedback');
  if(chosen===answer){fb.textContent='🎉 Correct! '+meaning;fb.className='ctc-feedback ok';showBurst();}
  else{fb.textContent='❌ Not quite — '+meaning;fb.className='ctc-feedback bad';}
  const nb=document.getElementById('ctc-next-btn');if(nb)nb.style.display='inline-block';
}
function attachMorphEvents(){}

// ── UTILS ─────────────────────────────────────────────────────────────────
function showBurst(){const b=document.getElementById('starburst');b.classList.add('show');setTimeout(()=>b.classList.remove('show'),1100)}


// ── INIT ──────────────────────────────────────────────────────────────────
currentLevel = 'gr1';
(function(){
  // mark correct level btn active on fixed-level pages
  document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('active'));
  const ab=document.querySelector('.level-btn.gr1');
  if(ab)ab.classList.add('active');
  setMode('wall');
  initHFW();
})();
</script>
